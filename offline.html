<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline — Winetime Asia</title>
<meta name="theme-color" content="#1a1a1a">
<link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="offline" style="background:var(--ink);">
<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="max-width:440px;text-align:center;color:var(--text-inverse);">
    <img src="icons/icon-192.png" alt="Winetime Asia" width="72" height="72" style="margin:0 auto 24px;border-radius:18px;box-shadow:var(--shadow-md);">
    <h1 style="color:#fff;font-size:1.7rem;">You're offline</h1>
    <p style="color:var(--text-inverse-muted);">It looks like there's no connection right now. Pages you've already visited may still be available &mdash; try going back, or reconnect and reload.</p>
    <button type="button" class="btn btn-primary" onclick="location.reload()" style="margin-top:12px;">Try again</button>
    <p style="margin-top:28px;"><a href="index.html" style="color:var(--pink-light);font-weight:600;">Back to Home</a></p>
  </div>
</main>
</body>
</html>
