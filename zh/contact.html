<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>联系 Winetime Asia</title>
<meta name="description" content="联系 Winetime Asia —— 致电、发送邮件或留言给我们。我们乐意为您解答订单、活动与其他各类问题。">
<meta name="theme-color" content="#333333">
<link rel="alternate" hreflang="en" href="https://www.winetime.asia/contact.html">
<link rel="alternate" hreflang="fr" href="https://www.winetime.asia/fr/contact.html">
<link rel="alternate" hreflang="zh-Hans" href="https://www.winetime.asia/zh/contact.html">
<link rel="alternate" hreflang="x-default" href="https://www.winetime.asia/contact.html">
<link rel="canonical" href="https://www.winetime.asia/zh/contact.html">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/favicon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="contact" data-locale="zh">
<a class="skip-link" href="#main">跳至内容</a>
<div id="site-header"></div>

<main id="main">

  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">首页</a><span>/</span><span>联系我们</span></div>
      <span class="eyebrow">联系我们</span>
      <h1>一起聊聊葡萄酒。</h1>
      <p class="lead">关于订单、婚礼的疑问,或只是想要一个推荐?欢迎联系我们 —— 每一条消息都会由真人亲自阅读回复。</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="grid grid--2" style="align-items:flex-start;gap:40px;">
        <form class="form-card" data-reveal data-mailto data-subject="来自联系页面的消息">
          <div class="field-row">
            <div class="field"><label for="c-name">姓名</label><input id="c-name" name="姓名" type="text" required></div>
            <div class="field"><label for="c-email">邮箱</label><input id="c-email" name="邮箱" type="email" required></div>
          </div>
          <div class="field"><label for="c-subject">主题</label>
            <select id="c-subject" name="主题">
              <option>一般咨询</option>
              <option>订单状态</option>
              <option>活动与婚礼咨询</option>
              <option>商务合作</option>
            </select>
          </div>
          <div class="field"><label for="c-message">留言内容</label><textarea id="c-message" name="留言内容" required placeholder="我们能为您提供什么帮助？"></textarea></div>
          <button type="submit" class="btn btn-primary" style="width:100%;">发送消息</button>
          <p class="form-feedback"></p>
          <p class="field-hint" style="margin-top:12px;">提交后将打开您的邮件应用,并预先填好此消息,发送至 sale@winetime.asia。</p>
        </form>

        <div data-reveal>
          <ul class="info-list">
            <li>
              <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8 9.9a16 16 0 0 0 6 6l1.4-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.8 2.1z"/></svg></span>
              <div><strong>电话</strong><a href="tel:+85585313203">+855 85 31 32 03</a></div>
            </li>
            <li>
              <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M3 6l9 7 9-7"/></svg></span>
              <div><strong>邮箱</strong><a href="mailto:sale@winetime.asia">sale@winetime.asia</a></div>
            </li>
            <li>
              <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
              <div><strong>公司所在地</strong><span>柬埔寨金边</span></div>
            </li>
            <li>
              <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>
              <div><strong>客服时间</strong><span>周一至周六,9:00–19:00</span></div>
            </li>
          </ul>
          <div class="footer-social" style="margin-top:22px;">
            <a href="https://www.facebook.com/" aria-label="Winetime Facebook 主页" target="_blank" rel="noopener" style="background:var(--pink-tint);color:var(--pink);"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg></a>
            <a href="https://www.instagram.com/" aria-label="Winetime Instagram 主页" target="_blank" rel="noopener" style="background:var(--pink-tint);color:var(--pink);"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg></a>
          </div>
          <div class="map-frame" style="margin-top:26px;">
            <iframe title="Winetime Asia — 柬埔寨金边" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=Phnom+Penh,+Cambodia&output=embed"></iframe>
          </div>
          <p class="field-hint" style="margin-top:10px;">详细到访地址可应要求提供 —— 欢迎致电或发送邮件联系我们。</p>
        </div>
      </div>
    </div>
  </section>

</main>

<div id="site-footer"></div>
<script src="../js/site.js"></script>
</body>
</html>
